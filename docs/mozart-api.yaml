    The Mozart API is an async REST API with WebSocket notification channel for immediate state information from Mozart devices. Currently the API is distributed as a [Python package](https://pypi.org/project/mozart-api) and as an OpenAPI document that can be found in the [Github repository](https://github.com/bang-olufsen/mozart-open-api/blob/main/mozart-api-6.2.0.44.yaml).


    Supported by:

    - [Beoconnect Core](https://www.bang-olufsen.com/en/dk/accessories/beoconnect-core)
    - [Beolab 8](https://www.bang-olufsen.com/en/dk/speakers/beolab-8)
    - [Beolab 28](https://www.bang-olufsen.com/en/dk/speakers/beolab-28)
    - [Beosound 2 3rd gen](https://www.bang-olufsen.com/en/dk/speakers/beosound-2)
    - [Beosound A5](https://www.bang-olufsen.com/en/dk/speakers/beosound-a5)
    - [Beosound A9 5th gen](https://www.bang-olufsen.com/en/dk/speakers/beosound-a9)
    - [Beosound Balance](https://www.bang-olufsen.com/en/dk/speakers/beosound-balance)
    - [Beosound Emerge](https://www.bang-olufsen.com/en/dk/speakers/beosound-emerge)
    - [Beosound Level](https://www.bang-olufsen.com/en/dk/speakers/beosound-level)
    - [Beosound Premiere](https://www.bang-olufsen.com/en/dk/soundbars/beosound-premiere)
    - [Beosound Theatre](https://www.bang-olufsen.com/en/dk/soundbars/beosound-theatre)


    This API documentation has been generated for version 6.2.0.44 of the Mozart platform and API generation version 6.2.0.44.0.

    ## Python API
    The Python package has been generated using the [OpenAPI Generator](https://openapi-generator.tech/) version 7.22.0. On top of the generated API, a helper file, mozart_client.py, has been made that makes the API more pythonic. We recommend using this.

    Another file, mozart_cli.py, has been made for using the Mozart API in a simple CLI program. This has been set as the "entry point" for the Python package.

    ### Installation

    The Mozart Open API can be installed with pip and requires [Python](https://www.python.org/downloads/).

    Install using pip:

    ```terminal
    pip3 install mozart_api
    ```

    ### API usage

    To use the Python API:

    - Create a MozartClient object
    - Choose which (if any) WebSocket events to listen to
    - Connect to the WebSocket notification channel (if needed)
    - Use any of the endpoints

    #### Example

    <!--
    type: tab
    title: API usage example
    -->

    <!-- title: "API usage example"
    lineNumbers: true
    -->

    ```python
    import asyncio

    from mozart_api.models import VolumeLevel, VolumeState
    from mozart_api.mozart_client import MozartClient, WebSocketEventType


    def all_notifications(notification: WebSocketEventType, notification_type: str) -> None:
        """Notification handler."""
        print(f"{notification_type} : {notification}")


    async def volume_notifications(notification: VolumeState) -> None:
        """Volume notification handler."""
        print(notification)


    async def test_api() -> None:
        """Test Mozart API."""

        mozart_client = MozartClient(host="192.168.0.1")

        mozart_client.get_all_notifications(all_notifications)
        mozart_client.get_volume_notifications(volume_notifications)

        await mozart_client.connect_notifications(remote_control=True)

        await mozart_client.set_current_volume_level(volume_level=VolumeLevel(level=50))
        await mozart_client.activate_preset(id=2)
        await mozart_client.post_beolink_expand(
            jid="1234.1234567.12345678@products.bang-olufsen.com",
        )

        listeners = await mozart_client.get_beolink_listeners()
        print(listeners)

        # Close aiohttp ClientSession
        await mozart_client.close_api_client()

        # Receive notifications
        while True:
            await asyncio.sleep(0)


    asyncio.run(test_api())
    ```

    <!--
    type: tab
    title: API usage example with async context manager
    -->

    <!-- title: "API usage example with async context manager"
    lineNumbers: true
    -->

    ```python
    import asyncio

    from mozart_api.models import VolumeLevel, VolumeState
    from mozart_api.mozart_client import MozartClient, WebSocketEventType


    def all_notifications(notification: WebSocketEventType, notification_type: str) -> None:
        """Notification handler."""
        print(f"{notification_type} : {notification}")


    async def volume_notifications(notification: VolumeState) -> None:
        """Volume notification handler."""
        print(notification)


    async def test_api() -> None:
        """Test Mozart API."""

        async with MozartClient(host="192.168.0.1") as mozart_client:
            mozart_client.get_all_notifications(all_notifications)
            mozart_client.get_volume_notifications(volume_notifications)

            await mozart_client.connect_notifications(remote_control=True)

            await mozart_client.set_current_volume_level(volume_level=VolumeLevel(level=50))
            await mozart_client.activate_preset(id=2)
            await mozart_client.post_beolink_expand(
                jid="1234.1234567.12345678@products.bang-olufsen.com",
            )

            listeners = await mozart_client.get_beolink_listeners()
            print(listeners)

            # Receive notifications
            while True:
                await asyncio.sleep(0)


    asyncio.run(test_api())
    ```

    <!-- type: tab-end -->

    Where `192.168.0.1` is a Mozart device's IP-address.

    #### Beware

    Some of the classes defined in the Mozart API are aliases to other data types, for example: `ActionList` is an array of `Action` objects. These classes are not generated and can therefore not be used in the Python API. instead, use the built in Python data types, for example when defining an ActionList, simply use a `list` instead.

    #### WebSocket notifications

    The most convenient way of getting state information from a Mozart device is through the WebSocket notification channel. The WebSocket listeners are run using [asyncio Tasks](https://docs.python.org/3/library/asyncio-task.html).

    A callback can be set for each of the WebSocket notifications. The callbacks can be functions or awaitable functions. To receive `WebSocketEventBeoRemoteButton` notifications requires that `remote_control=True` is defined when running the `connect_notifications()` method.

    All notification types are available as a set of strings in the NOTIFICATION_TYPES constant.

    #### Helper methods and functions

    A number of helper functions are available in the `mozart_client.py` file. These functions handle basic tasks, but do not interact with the REST API or WebSocket listener directly.

    Additionaly, helper methods are available in the `MozartClient` object and expand upon the basic functionality of a REST method.

    ##### refactor_notification_name

    The `refactor_notification_name` function transforms a WebSocket notification name to a simpler snake_case name:

    ```python
    >>> refactor_notification_name("WebSocketEventBeoRemoteButton")
    'beo_remote_button'
    ```

    ##### check_valid_jid

    The `check_valid_jid` determines if an input string is a valid Beolink JID:

    ```python
    >>> check_valid_jid("1234.1234567.12345678@products.bang-olufsen.com")
    True
    >>> check_valid_jid("1234567.12345678@products.bang-olufsen.com")
    False
    ```

    ##### check_valid_serial_number

    The `check_valid_serial_number` determines if an input string is a valid serial number:

    ```python
    >>> check_valid_serial_number("12345678")
    True
    >>> check_valid_serial_number("1234567")
    False
    ```

    ##### get_highest_resolution_artwork

    The `get_highest_resolution_artwork` function gets the highest resolution artwork available from provided `PlaybackContentMetadata`.

    ##### async_get_beolink_join_result

    The `get_beolink_join_result` method is used to retrieve a `BeolinkJoinResult` using a `BeolinkJoinRequest`, received from `join_latest_beolink_experience` or `join_beolink_peer` method calls. This result is only available after a device has joined. Until this result is available, the `get_beolink_join_result` method raises an `ApiException`.

    The `async_get_beolink_join_result` method repeatedly tries to get the `BeolinkJoinResult` with a 5 second timeout. This method returns a `BeolinkJoinResult` or `None` if it fails to get a result.

    ##### async_post_beolink_expand

    The `post_beolink_expand` method is used to expand a Beolink session to another device using a Beolink JID. This method does not return a result, so it is unknown if or when the expand was successful. A `NotFoundException` is raised if the listener was not found.

    The `async_post_beolink_expand` method checks for the requested listener's JID in the the Beolink leader's listeners, using the `get_beolink_listeners` method repeatedly with a 5 second timeout. This method returns a `True`, `ApiException`, `NotFoundException` or `TimeoutError` representing the expand result.

    ##### Extra callbacks

    Additionally, some useful callbacks are available that are not associated with a single notification type.

    <!--
    type: tab
    title: On connection lost
    -->

    The `get_on_connection_lost` method will set a callback when the WebSocket listener loses connection.

    <!-- title: "On connection lost example"
    lineNumbers: true
    -->

    ```python
    import asyncio

    from mozart_api.mozart_client import MozartClient


    async def test_api() -> None:
        """Test Mozart API."""

        def on_connection_lost() -> None:
            """Notification handler."""
            print("Connection lost")

        async with MozartClient(host="192.168.0.1") as mozart_client:
            mozart_client.get_on_connection_lost(on_connection_lost)
            await mozart_client.connect_notifications()

            # Receive notifications
            while True:
                await asyncio.sleep(0)


    asyncio.run(test_api())
    ```

    <!--
    type: tab
    title: On connection
    -->

    The `get_on_connection` method will set a callback when the WebSocket listener successfully establishes a connection.

    <!-- title: "On connection example"
    lineNumbers: true
    -->

    ```python
    import asyncio

    from mozart_api.mozart_client import MozartClient


    async def test_api() -> None:
        """Test Mozart API."""

        def on_connection() -> None:
            """Notification handler."""
            print("Connected")

        async with MozartClient(host="192.168.0.1") as mozart_client:
            mozart_client.get_on_connection(on_connection)
            await mozart_client.connect_notifications()

            # Receive notifications
            while True:
                await asyncio.sleep(0)


    asyncio.run(test_api())
    ```

    <!--
    type: tab
    title: All notifications
    -->

    The `get_all_notifications` method will set a callback on all WebSocket notifications received.

    The notification_type will return the name of the event with the `WebSocketEvent` prefix removed and the rest converted to snake_case: `WebSocketEventAlarmTriggered` ➞ `alarm_triggered`

    <!-- title: "All notifications example"
    lineNumbers: true
    -->

    ```python
    import asyncio

    from mozart_api.mozart_client import MozartClient, WebSocketEventType


    async def test_api() -> None:
        """Test Mozart API."""

        def all_notifications(notification: WebSocketEventType, notification_type: str) -> None:
            """Notification handler."""
            print(f"{notification_type} : {notification}")

        async with MozartClient(host="192.168.0.1") as mozart_client:
            mozart_client.get_all_notifications(all_notifications)
            await mozart_client.connect_notifications()

            # Receive notifications
            while True:
                await asyncio.sleep(0)


    asyncio.run(test_api())
    ```

    <!--
    type: tab
    title: All notifications "raw"
    -->

    The `get_all_notifications_raw` method will set a callback on all WebSocket notifications received and will not deserialize the received JSON or dict.

    <!-- title: "All notifications "raw" example"
    lineNumbers: true
    -->

    ```python
    import asyncio

    from mozart_api.mozart_client import BaseWebSocketResponse, MozartClient


    async def test_api() -> None:
        """Test Mozart API."""

        def all_notifications_raw(notification: BaseWebSocketResponse) -> None:
            """Notification handler."""
            print(notification)

        async with MozartClient(host="192.168.0.1") as mozart_client:
            mozart_client.get_all_notifications_raw(all_notifications_raw)
            await mozart_client.connect_notifications()

            # Receive notifications
            while True:
                await asyncio.sleep(0)


    asyncio.run(test_api())
    ```

    <!-- type: tab-end -->

    #### Discovering Mozart devices on the network

    Mozart devices can be found through MDNS using the service name: `_bangolufsen._tcp.local.`

    The service provides everything immediately necessary for using the device, including IP address, all components for the Beolink JID, model name, friendly name, software version and more.

    ### Example CLI program

    The CLI program carries out one command and then exits afterwards. The program needs to do a device-discovery on each command, which in noisy environments could take some time. If speed is important, an IP-address can be used instead.

    Additionally since the CLI uses MDNS for device discovery, port number 5353 needs to be open.

    #### Usage example

    This example shows device discovery and afterwards joining a Beolink session with WebSocket events being printed.

    ![example gif](https://raw.githubusercontent.com/bang-olufsen/mozart-open-api/main/docs/media/discovery_join.gif)

    #### Device discovery

    <!--
    type: tab
    title: Discover
    -->

    ##### discover

    Discover Mozart devices on the network.

    ```terminal
    mozart_api discover
    ```

    <!--
    type: tab
    title: Serial number
    -->

    ##### serial number

    Ensure that the serial number is reachable on the network.

    ```terminal
    mozart_api 12345678
    ```

    <!-- type: tab-end -->

    #### Options

    <!--
    type: tab
    title: Verbose
    -->

    ##### verbose

    Add as option to add verbose output.

    ```terminal
    mozart_api serial_number command command_args -v

    mozart_api serial_number command command_args --verbose
    ```

    <!--
    type: tab
    title: Timeout
    -->

    ##### timeout

    Add as option with parameter to modify MDNS discovery timeout.

    Optionally use '-1' to have a user-interrupted device discovery:

    ```terminal
    mozart_api serial_number command command_args -t 20

    mozart_api serial_number command command_args --timeout 20

    mozart_api serial_number command command_args --timeout -1
    ```

    <!--
    type: tab
    title: WebSocket
    -->

    ##### websocket

    Add as option to show WebSocket notifications before and after command execution.

    Upon connection the overall state of the device will be immediately transferred.

    ```terminal
    mozart_api serial_number command command_args -w

    mozart_api serial_number command command_args --websocket
    ```

    <!-- type: tab-end -->

    #### Commands

    <!--
    type: tab
    title: Playback
    -->

    ##### preset

    Will activate the _preset_ command.

    ```terminal
    mozart_api 12345678 preset 1
    ```

    ##### play

    Will activate the _play_ playback command.

    ```terminal
    mozart_api 12345678 play
    ```

    ##### pause

    Will activate the _pause_ playback command.

    ```terminal
    mozart_api 12345678 pause
    ```

    ##### next

    Will activate the _next_ playback command.

    ```terminal
    mozart_api 12345678 next
    ```

    ##### previous

    Will activate the _previous_ playback command.

    ```terminal
    mozart_api 12345678 previous
    ```

    <!--
    type: tab
    title: Volume
    -->

    ##### mute

    Will activate the mute command.

    ```terminal
    mozart_api 12345678 mute
    ```

    ##### unmute

    Will activate the unmute command.

    ```terminal
    mozart_api 12345678 unmute
    ```

    ##### volume

    Will activate the modify volume level command on the device (0-100).

    ```terminal
    mozart_api 12345678 volume 50
    ```

    <!--
    type: tab
    title: Beolink
    -->

    ##### join

    Will join a Beolink experience if available or will join a specific Beolink experience if available.

    ```terminal
    mozart_api 12345678 join

    mozart_api 12345678 join 23456789
    ```

    ##### allstandby

    Will set all connected Beolink devices to networkStandby.

    ```terminal
    mozart_api 12345678 allstandby
    ```

    <!--
    type: tab
    title: Miscellaneous
    -->

    ##### info

    Will print device information.

    ```terminal
    mozart_api 12345678 info
    ```

    ##### version

    Will print device API version.

    ```terminal
    mozart_api version
    ```

