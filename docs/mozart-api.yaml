          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      tags:
        - Product
        - mozart
  /api/v1/state/power:
    get:
      operationId: get-power-state
      summary: Get power state of the product
      description: |-
        Use the `get-power-state` method in the Python package with one of:
        ```mozart_client
        await mozart_client.get_power_state()
        ```
        ```mozart_api
        await mozart_api.get_power_state()
        ```
        ```power_api
        await power_api.get_power_state()
        ```
      responses:
        '200':
          description: The power state of the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerStateEnum'
      tags:
        - Power
        - mozart
  /api/v1/state/reboot:
    put:
      operationId: post-reboot
      summary: Reboot the mozart device
      description: |-
        Use the `post-reboot` method in the Python package with one of:
        ```mozart_client
        await mozart_client.post_reboot()
        ```
        ```mozart_api
        await mozart_api.post_reboot()
        ```
        ```power_api
        await power_api.post_reboot()
        ```
      responses:
        '200':
          description: The device is being rebooted
        '400':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      tags:
        - Power
        - mozart
  /api/v1/state/standby:
    put:
      operationId: post-standby
      summary: Put the device in standby
      description: |-
        Use the `post-standby` method in the Python package with one of:
        ```mozart_client
        await mozart_client.post_standby()
        ```
        ```mozart_api
        await mozart_api.post_standby()
        ```
        ```power_api
        await power_api.post_standby()
        ```
      responses:
        '200':
          description: The device is put in standby
        '400':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
      tags:
        - Power
        - mozart
components:
  parameters:
    ListeningModeID:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ListeningModeID'
  schemas:
    Action:
      description: |
        An action object. Examples:

        RadioAction:
        ```json
        {
          "type": "radio",
          "radioStationId": "8779112938791514"
        }
        ```

        ToneAction:
        ```json
        {
          "type": "tone",
          "toneName": "alarm_2"
        }
        ```

        SourcePresetAction:
        ```json
        {
          "type": "sourcePreset",
          "source": {
            "value": "spotify"
          },
          "presetKey": "Preset3"
        }
        ```

        DeezerFlowAction:
        ```json
        {
          "type": "deezerFlow",
          "deezerUserId": "1234"
        }
        ```

        ActivateSourceAction:
        ```json
        {
          "type": "activateSource",
          "source": {
            "value": "spotify"
          }
        }
        ```

        PlayQueueAction:
        ```
          {
            "type": "playQueue",
            "queueItem": {
              "provider": {
                "value": "deezer"
              },
              "startNowFromPosition": 0,
              "type": "playlist",
              "uri": "playlist:8074581462"
            },
            "queueSettings": {
              "consume": false,
              "repeat": "none",
              "shuffle": false
            }
          }
        ```

        StandbyAction:
        ```json
        {
          "type": "standby"
        }
        ```

        AllStandbyAction:
        ```json
        {
          "type": "allStandby"
        }
        ```

        TouchToJoinAction:
        ```json
        {
          "type": "touchToJoin"
        }
        ```

        ButtonShortPressAction:
        ```json
        {
          "type": "buttonShortPress",
          "buttonName": "preset1"
        }
        ```

        FallbackAction:
        ```json
        {
          "type": "fallback"
        }
        ```

        VolumeAction:
        ```json
        {
          "type": "volume",
          "volumeLevel": 25
        }
        ```

        StopAction:
        ```json
        {
          "type": "stop",
          "stopDuration": 1300
        }
        ```

        TriggerContentAction:
        ```json
        {
          "contentId": "tv://netflix",
          "type": "triggerContent"
        }
        ```

        SpeakerGroupAction:
        ```json
        {
          "type": "speakerGroup",
          "speakerGroupId": "00112233-4455-6677-8899-aabbccddeeff"
        }
        ```

        ListeningModeAction:
        ```json
        {
          "type": "listeningMode",
          "listeningModeId": 1234
        }
        ```

        StandAction:
        ```json
        {
          "type": "stand",
          "standPosition": {
            "angle": 7.5
          }
        }
        ```

        GainAction:
        ```json
        {
          "type": "sourceGain",
          "source": {
            "value": "spotify"
          },
          "gainDb": 1.0
        }
        ```

        SoundProfileAction:
        ```json
        {
          "type": "soundProfile",
          "soundProfile": {
            "speakerId1": {
              "directivity": "wide"
            },
            "speakerId2": {
              "directivity": "narrow"
            }
          }
        }
        ```
      type: object
      properties:
        buttonName:
          description: Name of the Button used for button-press types ('buttonShortPress')
          type: string
          enum:
            - preset1
            - preset2
            - preset3
            - preset4
          nullable: true
        contentId:
          description: Id of content only used for 'type=triggerContent'
          type: string
          nullable: true
        deezerUserId:
          description: Id of user only used for 'type=deezerFlow' and is optional
          type: string
          nullable: true
          pattern: ^\d{10}$
        gainDb:
          description: Only used for 'type=sourceGain'
          type: number
          maximum: 12
          minimum: -12
        listeningModeId:
          description: Only used for 'type=listeningMode'
          $ref: '#/components/schemas/ListeningModeID'
          nullable: true
        presetKey:
          description: Only used for 'type=sourcePreset'
          type: string
          nullable: true
          pattern: ^Preset[0-9]+$
        queueItem:
          description: PlayQueue item only used for 'type=playQueue'
          $ref: '#/components/schemas/PlayQueueItem'
          nullable: true
        queueSettings:
          description: PlayQueue settings only used for 'type=playQueue' and is optional
          $ref: '#/components/schemas/PlayQueueSettings'
          nullable: true
        radioStationId:
          description: Id of RadioStation only used for 'type=radio'
          type: string
          nullable: true
          pattern: ^\d{16}$
        soundProfile:
          description: Only used for 'type=soundProfile'
          type: object
          example:
            speakerId1:
              directivity: directivity1
            speakerId2:
              directivity: directivity1
          additionalProperties:
            $ref: '#/components/schemas/ActionSoundProfile'
          nullable: true
        source:
          $ref: '#/components/schemas/SourceTypeEnum'
          nullable: true
        speakerGroupId:
          description: Only used for 'type=speakerGroup'
          $ref: '#/components/schemas/SpeakerGroupId'
          nullable: true
        standPosition:
          description: Only used for 'type=stand'
          $ref: '#/components/schemas/StandPosition'
        stopDuration:
          description: The duration to wait (seconds) until stopping only used for 'type=stop'
          type: integer
          format: int32
          minimum: 0
          nullable: true
        toneName:
          description: Name of the tone only used for 'type=tone'
          type: string
          enum:
            - alarm_1
            - alarm_2
          nullable: true
        type:
          description: The type of Action
          type: string
          enum:
            - standby
            - tone
            - radio
            - sourcePreset
            - deezerFlow
            - activateSource
            - playQueue
            - buttonShortPress
            - allStandby
            - touchToJoin
            - fallback
            - volume
            - stop
            - triggerContent
            - speakerGroup
            - listeningMode
            - stand
            - sourceGain
            - soundProfile
        volumeLevel:
          description: The volume level to configure only used for 'type=volume'
          type: integer
          format: int32
          maximum: 100
          minimum: 0
          nullable: true
      required:
        - type
    ActionList:
      description: An ordered list of Actions to run on the product
      type: array
      items:
        $ref: '#/components/schemas/Action'
      example:
        - type: volume
          volumeLevel: 35
        - radioStationId: '8779112938791514'
          type: radio
        - stopDuration: 1300
          type: stop
    ActionSoundProfile:
      type: object
      properties:
        directivity:
          type: string
          nullable: true
    AdvancedBeamforming:
      type: object
      properties:
